<div>
  <h1>Administracion de articulos</h1>
  @if(hayRegistros()){
    
    <table>
      <thead>
        <tr>
          <th>Codigo</th>
          <th>Descripcion</th>
          <th>Precio</th>
          <th>Borrar</th>
          <th>Seleccionar</th>
        </tr>
      </thead>
      <tbody>
        @for(art of articulos(); track art.codigo){

          <tr>
            <td>{{art.codigo}}</td>
            <td>{{art.descripcion}}</td>
            <td>{{art.precio}}</td>
            <td><button (click)="borrar(art.codigo)">Borrar?</button></td>
            <td><button (click)="seleccionar(art)">Seleccionar?</button></td>            
          </tr>
        }
      </tbody>
    </table>
  }
  @else {
    <p>No hay articulos</p>
  }
  <div>
    <p>
      Codigo: 
      <input
        type="number"
        [(ngModel)]="art().codigo"
        (ngModelChange)="art().codigo"        
      />
    </p>
    <p>
      Descripcion: 
      <input type="text" 
      [(ngModel)]="art().descripcion"
      (ngModelChange)="art().descripcion"   
      />
    </p>
    <p>
      Precio
      <input type="text"
      [(ngModel)]="art().precio"
      (ngModelChange)="art().precio">
    </p>
    <p>
    </p>
    <p>
      <button (click)="agregar()">Agregar</button>
      <button (click)="modificar()">Modificar</button>
    </p>
  </div>
</div>
